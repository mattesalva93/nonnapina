services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keepa_tracker
      POSTGRES_USER: keepa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keepa -d keepa_tracker']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://keepa:${POSTGRES_PASSWORD}@postgres:5432/keepa_tracker
      NODE_ENV: production
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - output_data:/app/output
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  output_data:
