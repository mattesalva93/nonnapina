name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false # Non interrompere un deploy in corso

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    environment: production # ← Usa i secrets dell'ambiente "production"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy production compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'docker-compose.prod.yml'
          target: '/home/deploy/nonnapina-prod/'

      - name: Deploy application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/home/deploy/nonnapina-prod"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Write .env from GitHub environment secrets
            cat > .env << 'ENVEOF'
            NODE_ENV=production
            PORT=3000
            API_SECRET=${{ secrets.API_SECRET }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AMAZON_ACCESS_KEY=${{ secrets.AMAZON_ACCESS_KEY }}
            AMAZON_SECRET_KEY=${{ secrets.AMAZON_SECRET_KEY }}
            AMAZON_PARTNER_TAG=${{ secrets.AMAZON_PARTNER_TAG }}
            AMAZON_MARKETPLACE=${{ secrets.AMAZON_MARKETPLACE }}
            AMAZON_STOREFRONT_ID=${{ secrets.AMAZON_STOREFRONT_ID }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            WHATSAPP_CHANNEL_ID=${{ secrets.WHATSAPP_CHANNEL_ID }}
            WHATSAPP_SESSION_PATH=./.wwebjs_auth
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            ALERT_EMAIL_FROM=${{ secrets.ALERT_EMAIL_FROM }}
            ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }}
            ALERT_EMAIL_CC=${{ secrets.ALERT_EMAIL_CC }}
            KEEPA_CATEGORIES=${{ secrets.KEEPA_CATEGORIES }}
            MAX_PRODUCTS_PER_CATEGORY=${{ secrets.MAX_PRODUCTS_PER_CATEGORY }}
            SCRAPING_DELAY_MS=${{ secrets.SCRAPING_DELAY_MS }}
            ENVEOF
            chmod 600 .env

            # Authenticate to GHCR, pull latest image, then logout to avoid
            # storing credentials unencrypted in ~/.docker/config.json
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null
            docker pull ghcr.io/${{ github.repository }}:latest
            docker logout ghcr.io

            # Deploy with docker compose
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for health check
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T app \
                node -e "fetch('http://localhost:3000/health').then(r=>{if(r.ok)process.exit(0);else process.exit(1)}).catch(()=>process.exit(1))" 2>/dev/null; then
                echo "✅ Health check passed!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Health check failed after 30 attempts"
                docker compose -f docker-compose.prod.yml logs --tail=50 app
                exit 1
              fi
              echo "  Attempt $i/30 — waiting..."
              sleep 5
            done

            # Show final status
            docker compose -f docker-compose.prod.yml ps

            # Prune old Docker images after deploy.
            # Each image is ~3.75 GB — without cleanup the 38 GB disk fills in ~10 deploys.
            # Docker 29+ with containerd image store needs dangling image removal.
            echo "Pruning unused Docker images..."
            docker image prune -f
            echo "Disk after cleanup: $(df -h / | tail -1 | awk '{print $4 " free (" $5 " used)"}')"
