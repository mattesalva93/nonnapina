name: nonnapina-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nonnapina_prod
      POSTGRES_USER: npadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Porta esposta SOLO su localhost (non raggiungibile da internet)
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U npadmin -d nonnapina_prod']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  app:
    # ⬇️ Immagine da GHCR invece che build locale
    image: ghcr.io/mattesalva93/nonnapina:latest
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://npadmin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nonnapina_prod
      NODE_ENV: production
      API_SECRET: ${API_SECRET:?API_SECRET is required}
      TZ: Europe/Rome
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - output_data:/app/output
      - whatsapp_session:/app/.wwebjs_auth
    read_only: true
    shm_size: '2g'
    tmpfs:
      - /tmp:size=256M
      - /home/appuser:size=128M,uid=1001,gid=1001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 5G
          cpus: '3.0'
        reservations:
          memory: 1G
          cpus: '0.5'

volumes:
  postgres_data:
  output_data:
  whatsapp_session:
