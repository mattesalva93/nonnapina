<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{PAGE_TITLE}}</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 120px;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
        min-height: 100vh;
      }

      /* Logo Header */
      .page-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        padding: 15px 40px;
        margin: -20px -20px 30px -20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .logo-container {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .logo {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      .logo-title {
        font-size: 1.8em;
        font-weight: bold;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 2px;
      }

      .back-to-index {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95em;
        white-space: nowrap;
      }

      .back-to-index:hover {
        background: linear-gradient(135deg, #5568d3 0%, #653a8b 100%);
      }

      /* Main Container */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        text-align: center;
        color: #667eea;
        margin-bottom: 40px;
        font-size: 2.5em;
        text-transform: uppercase;
        letter-spacing: 3px;
        border-bottom: 3px solid #667eea;
        padding-bottom: 20px;
      }

      /* Category Index */
      .category-index {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 25px;
        margin-bottom: 40px;
        border: 2px solid #e0e0e0;
      }

      .category-index h2 {
        color: #667eea;
        font-size: 1.5em;
        margin-bottom: 15px;
        text-align: center;
      }

      .category-index ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }

      .category-index li {
        display: inline-block;
      }

      .category-index a {
        display: inline-block;
        padding: 10px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95em;
      }

      .category-index a:hover {
        background: linear-gradient(135deg, #5568d3 0%, #653a8b 100%);
      }

      /* Category Header */
      .category-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        margin: 40px -40px 30px -40px;
        text-align: center;
        font-size: 1.8em;
        text-transform: uppercase;
        letter-spacing: 4px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      .category-header:first-of-type {
        margin-top: 0;
      }

      /* Product Card */
      .product {
        margin-bottom: 40px;
        padding: 30px;
        background: #f9f9f9;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      /* Image Section */
      .image-section {
        text-align: center;
        margin-bottom: 25px;
        padding: 20px;
        background: white;
        border-radius: 8px;
      }

      .product-image {
        max-width: 100%;
        height: auto;
        max-height: 400px;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        margin-bottom: 15px;
      }

      .image-link {
        display: inline-block;
        color: #667eea;
        text-decoration: none;
        font-size: 0.9em;
        padding: 8px 16px;
        border: 2px solid #667eea;
        border-radius: 6px;
      }

      .image-link:hover {
        background: #667eea;
        color: white;
      }

      /* Copyable Content Section */
      .copyable-content {
        display: flex;
        gap: 20px;
        align-items: flex-start;
        background: white;
        padding: 25px;
        border-radius: 8px;
        border: 2px solid #e0e0e0;
      }

      .text-content {
        flex: 1;
      }

      .text-content pre {
        font-family: inherit;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 1.05em;
        line-height: 1.8;
        color: #444;
      }

      .hidden-copy-text {
        position: absolute;
        left: -9999px;
        opacity: 0;
        pointer-events: none;
      }

      /* Copy Button */
      .copy-btn {
        flex-shrink: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9em;
        font-weight: bold;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        min-width: 85px;
      }

      .copy-btn:hover {
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .copy-btn.copied {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      }

      .copy-icon {
        font-size: 1.3em;
      }

      .copy-text {
        font-size: 0.85em;
      }

      /* Copy Status Badge */
      .copy-status-badge {
        margin-top: 15px;
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 0.85em;
        font-weight: 600;
        text-align: center;
      }

      .copy-status-badge.new {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
      }

      .copy-status-badge.copied {
        background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
        color: white;
      }

      /* Product Separator */
      .product-separator {
        border: none;
        height: 2px;
        background: linear-gradient(to right, transparent, #667eea, transparent);
        margin: 30px 0;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .page-header {
          padding: 10px 20px;
          margin: -20px -20px 20px -20px;
        }

        .logo {
          width: 40px;
          height: 40px;
        }

        .logo-title {
          font-size: 1.2em;
        }

        .back-to-index {
          font-size: 0.85em;
          padding: 8px 14px;
        }

        .back-to-index span:last-child {
          display: none;
        }

        .container {
          padding: 20px;
        }

        h1 {
          font-size: 1.8em;
        }

        .category-header {
          margin-left: -20px;
          margin-right: -20px;
          font-size: 1.3em;
          padding: 15px;
        }

        .copyable-content {
          flex-direction: column;
        }

        .copy-btn {
          width: 100%;
          flex-direction: row;
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <!-- Page Header with Logo -->
    <div class="page-header">
      <div class="logo-container">
        <img src="{{LOGO_PATH}}" alt="Logo" class="logo" />
        <span class="logo-title">I CONSIGLI DI NONNA PINA DEALS</span>
      </div>
      <a href="#category-index" class="back-to-index">
        <span>📑</span>
        <span>&nbsp;Torna all'Indice</span>
      </a>
    </div>

    <!-- Main Content Container -->
    <div class="container">
      <h1>{{PAGE_TITLE}}</h1>

      <!-- Category Index -->
      {{CATEGORY_INDEX}}

      <!-- Products will be inserted here -->
      <div id="products-container">{{PRODUCTS_CONTENT}}</div>
    </div>

    <!-- Copy to Clipboard Script -->
    <script>
      function copyToClipboard(button) {
        // Find the hidden textarea with the text content
        const copyableContent = button.closest('.copyable-content');
        const textarea = copyableContent.querySelector('.hidden-copy-text');

        if (!textarea) {
          alert('Errore: testo non trovato');
          return;
        }

        // Select and copy the text
        textarea.select();
        textarea.setSelectionRange(0, 99999); // For mobile devices

        try {
          // Modern way: using Clipboard API
          navigator.clipboard
            .writeText(textarea.value)
            .then(() => {
              showCopyFeedback(button);
            })
            .catch(err => {
              // Fallback for older browsers
              fallbackCopy(button, textarea);
            });
        } catch (err) {
          // Fallback for older browsers
          fallbackCopy(button, textarea);
        }
      }

      function fallbackCopy(button, textarea) {
        try {
          document.execCommand('copy');
          showCopyFeedback(button);
        } catch (e) {
          alert('Impossibile copiare. Prova a selezionare manualmente il testo.');
        }
      }

      function showCopyFeedback(button) {
        const originalText = button.querySelector('.copy-text').textContent;
        button.classList.add('copied');
        button.querySelector('.copy-icon').textContent = '✅';
        button.querySelector('.copy-text').textContent = 'Copiato!';

        // Update copy status badge
        const productCard = button.closest('.product');
        const statusBadge = productCard.querySelector('.copy-status-badge');
        if (statusBadge) {
          const now = new Date();
          const timeString = now.toLocaleTimeString('it-IT', {
            hour: '2-digit',
            minute: '2-digit',
          });
          statusBadge.classList.remove('new');
          statusBadge.classList.add('copied');
          statusBadge.textContent = `✓ Già copiata (${timeString})`;
        }

        setTimeout(() => {
          button.classList.remove('copied');
          button.querySelector('.copy-icon').textContent = '📋';
          button.querySelector('.copy-text').textContent = originalText;
        }, 2000);
      }
    </script>
  </body>
</html>
