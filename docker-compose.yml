name: nonnapina

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nonnapina
      POSTGRES_USER: npadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U npadmin -d nonnapina']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://npadmin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/nonnapina
      NODE_ENV: production
      TZ: Europe/Rome
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - output_data:/app/output
      - whatsapp_session:/app/.wwebjs_auth
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  output_data:
  whatsapp_session:
